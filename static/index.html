<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG-Powered Search Engine</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; background: #0f1117; color: #e8e8ec; }
  h1 { font-size: 1.4rem; }
  input, button, textarea { font-size: 1rem; }
  #q { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1c24; color: #fff; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 18px; border-radius: 8px; border: none; background: #4f8cff; color: white; cursor: pointer; }
  button:hover { background: #3d75e0; }
  #answer { margin-top: 24px; white-space: pre-wrap; background: #1a1c24; padding: 16px; border-radius: 8px; min-height: 40px; }
  .source { font-size: 0.85rem; color: #9aa; margin-top: 4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #223; font-size: 0.75rem; margin-left: 8px; }
</style>
</head>
<body>
  <h1>🔎 RAG-Powered Search Engine <span class="badge">arXiv corpus</span></h1>
  <p>Ask a question about retrieval-augmented generation research papers.</p>
  <input id="q" type="text" placeholder="e.g. What are common chunking strategies for RAG?" />
  <button onclick="ask()">Ask</button>
  <div id="answer"></div>

  <script>
    async function ask() {
      const q = document.getElementById('q').value;
      const answerBox = document.getElementById('answer');
      answerBox.textContent = "Thinking...";
      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, k: 5 })
        });
        const data = await res.json();
        if (!res.ok) { answerBox.textContent = "Error: " + (data.detail || res.statusText); return; }
        let html = data.answer.replace(/</g, "&lt;");
        html += "\n\n---\nSources:\n";
        for (const s of data.sources) {
          html += `- ${s.title} (score: ${s.score.toFixed(3)})\n`;
        }
        answerBox.textContent = html;
      } catch (e) {
        answerBox.textContent = "Request failed: " + e;
      }
    }
  </script>
</body>
</html>
